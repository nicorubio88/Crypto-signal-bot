<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Signal Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 20px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 1.4rem; color: #58a6ff; }
  .meta { font-size: 0.8rem; color: #8b949e; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; border: 1px solid #30363d; background: #161b22; color: #8b949e; transition: all 0.2s; }
  .tab.active { background: #58a6ff; color: #0d1117; border-color: #58a6ff; font-weight: 600; }
  .btn { background: #21262d; border: 1px solid #30363d; color: #58a6ff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; }
  .btn:hover { background: #30363d; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .card.long::before { background: #2ea043; }
  .card.short::before { background: #da3633; }
  .card.neutral::before { background: #8b949e; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .asset-name { font-size: 1.3rem; font-weight: 700; }
  .asset-price { font-size: 1.1rem; color: #8b949e; }
  .signal-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
  .badge-long { background: #0f3320; color: #2ea043; border: 1px solid #2ea043; }
  .badge-short { background: #3d0f0f; color: #da3633; border: 1px solid #da3633; }
  .badge-neutral { background: #1c2128; color: #8b949e; border: 1px solid #8b949e; }
  .score-section { margin-bottom: 16px; }
  .score-label { font-size: 0.75rem; color: #8b949e; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .score-bar { background: #21262d; border-radius: 4px; height: 8px; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 4px; }
  .fill-long { background: #2ea043; }
  .fill-short { background: #da3633; }
  .fill-neutral { background: #8b949e; }
  .indicators { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .kpi { background: #0d1117; border-radius: 8px; padding: 8px 10px; }
  .kpi-label { font-size: 0.7rem; color: #8b949e; margin-bottom: 2px; }
  .kpi-value { font-size: 0.95rem; font-weight: 600; }
  .conditions { margin-bottom: 16px; }
  .cond-title { font-size: 0.75rem; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; }
  .cond-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; padding: 3px 0; color: #8b949e; }
  .cond-item.pass { color: #e6edf3; }
  .cond-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot-pass { background: #2ea043; }
  .dot-fail { background: #da3633; }
  .levels { background: #0d1117; border-radius: 8px; padding: 10px; font-size: 0.8rem; }
  .levels-title { color: #8b949e; margin-bottom: 8px; font-size: 0.75rem; text-transform: uppercase; }
  .level-row { display: flex; justify-content: space-between; padding: 2px 0; }
  .level-sl { color: #da3633; }
  .level-tp1 { color: #2ea043; }
  .level-tp2 { color: #56d364; }
  .trend-1d { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; margin-bottom: 12px; }
  .trend-alcista { background: #0f3320; color: #2ea043; }
  .trend-bajista { background: #3d0f0f; color: #da3633; }
  .trend-lateral { background: #1c2128; color: #8b949e; }
  .alert-rsi { background: #2d2100; border: 1px solid #bb8009; color: #f0b429; border-radius: 6px; padding: 6px 10px; font-size: 0.78rem; margin-bottom: 12px; }

  /* Pestaña Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; }
  .stat-asset { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: #58a6ff; }
  .win-rates { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .wr-box { background: #0d1117; border-radius: 8px; padding: 10px; text-align: center; }
  .wr-label { font-size: 0.7rem; color: #8b949e; margin-bottom: 4px; }
  .wr-value { font-size: 1.4rem; font-weight: 700; }
  .wr-sub { font-size: 0.7rem; color: #8b949e; margin-top: 2px; }
  .wr-good { color: #2ea043; }
  .wr-bad { color: #da3633; }
  .wr-neutral { color: #8b949e; }
  .recent-title { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; margin-bottom: 8px; }
  .signal-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #21262d; font-size: 0.8rem; }
  .signal-row:last-child { border-bottom: none; }
  .sig-date { color: #8b949e; font-size: 0.72rem; }
  .sig-result { display: flex; gap: 6px; }
  .res-dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; }
  .res-win { background: #0f3320; color: #2ea043; }
  .res-loss { background: #3d0f0f; color: #da3633; }
  .res-pending { background: #1c2128; color: #8b949e; }
  .no-data { text-align: center; color: #8b949e; padding: 40px; font-size: 0.9rem; }
  .loading { text-align: center; color: #8b949e; padding: 60px; }
  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Crypto Signal Bot</h1>
    <div class="meta" id="last-update">Cargando...</div>
  </div>
  <button class="btn" onclick="forceRefresh()">Actualizar</button>
</header>

<div class="tabs">
  <div class="tab active" onclick="showTab('signals')">Señales en vivo</div>
  <div class="tab" onclick="showTab('stats')">Acertividad</div>
  <div class="tab" onclick="showTab('history')">Historial</div>
</div>

<!-- Tab: Señales -->
<div id="tab-signals">
  <div id="grid" class="grid"><div class="loading">Cargando análisis...</div></div>
</div>

<!-- Tab: Acertividad -->
<div id="tab-stats" class="hidden">
  <div id="stats-grid" class="stats-grid"><div class="loading">Cargando estadísticas...</div></div>
</div>

<!-- Tab: Historial -->
<div id="tab-history" class="hidden">
  <div id="history-table"><div class="loading">Cargando historial...</div></div>
</div>

<script>
let currentTab = 'signals';

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['signals','stats','history'][i] === tab);
  });
  document.getElementById('tab-signals').classList.toggle('hidden', tab !== 'signals');
  document.getElementById('tab-stats').classList.toggle('hidden', tab !== 'stats');
  document.getElementById('tab-history').classList.toggle('hidden', tab !== 'history');

  if (tab === 'stats') loadStats();
  if (tab === 'history') loadHistory();
}

// ── Señales en vivo ──────────────────────────────────────────────────────────

async function loadData() {
  try {
    const r = await fetch('/api/data');
    const data = await r.json();
    document.getElementById('last-update').textContent = 'Última actualización: ' + (data.last_update || '—');
    renderGrid(data.results || []);
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="loading">Error al cargar datos</div>';
  }
}

function getSignalClass(s) { return s?.includes('LONG') ? 'long' : s?.includes('SHORT') ? 'short' : 'neutral'; }
function getBadgeClass(s)  { return s?.includes('LONG') ? 'badge-long' : s?.includes('SHORT') ? 'badge-short' : 'badge-neutral'; }
function getFillClass(s)   { return s?.includes('LONG') ? 'fill-long' : s?.includes('SHORT') ? 'fill-short' : 'fill-neutral'; }
function getTrendClass(t)  { return t === 'ALCISTA' ? 'trend-alcista' : t === 'BAJISTA' ? 'trend-bajista' : 'trend-lateral'; }
function scoreWidth(score, max) { return Math.round(((score + max) / (max * 2)) * 100); }

function renderCard(r) {
  if (r.error) return `<div class="card"><div style="color:#da3633">${r.name}: ${r.error}</div></div>`;
  const sc = getSignalClass(r.signal), bc = getBadgeClass(r.signal), fc = getFillClass(r.signal);
  const tc = getTrendClass(r.trend_1d), sw = scoreWidth(r.score, r.max_score);
  const isLong = r.signal?.includes('LONG'), isShort = r.signal?.includes('SHORT');
  const lvl = r.levels || {};
  const sl  = isLong ? lvl.stop_long  : isShort ? lvl.stop_short  : null;
  const tp1 = isLong ? lvl.tp1_long   : isShort ? lvl.tp1_short   : null;
  const tp2 = isLong ? lvl.tp2_long   : isShort ? lvl.tp2_short   : null;
  const condHtml = Object.entries(r.conditions || {}).map(([k,v]) =>
    `<div class="cond-item ${v?'pass':''}"><div class="cond-dot ${v?'dot-pass':'dot-fail'}"></div>${k}</div>`).join('');
  const rsiAlert = r.rsi6_oversold ? `<div class="alert-rsi">RSI(6) en sobreventa (${r.rsi6}) — posible rebote</div>`
    : r.rsi6_overbought ? `<div class="alert-rsi">RSI(6) en sobrecompra (${r.rsi6}) — posible corrección</div>` : '';
  const levelsHtml = sl ? `<div class="levels"><div class="levels-title">Niveles sugeridos (ATR×2)</div>
    <div class="level-row"><span class="level-sl">Stop Loss</span><span class="level-sl">$${Number(sl).toLocaleString()}</span></div>
    <div class="level-row"><span class="level-tp1">TP1</span><span class="level-tp1">$${Number(tp1).toLocaleString()}</span></div>
    <div class="level-row"><span class="level-tp2">TP2</span><span class="level-tp2">$${Number(tp2).toLocaleString()}</span></div></div>` : '';
  return `<div class="card ${sc}">
    <div class="card-header">
      <div><div class="asset-name">${r.name}/USDT</div><div class="asset-price">$${Number(r.price).toLocaleString()}</div></div>
      <div class="signal-badge ${bc}">${r.signal || 'NEUTRAL'}</div>
    </div>
    <span class="trend-1d ${tc}">1D: ${r.trend_1d || '—'}</span>
    <div class="score-section">
      <div class="score-label"><span>Score de señal</span><span>${r.score > 0 ? '+' : ''}${r.score} / ${r.max_score}</span></div>
      <div class="score-bar"><div class="score-fill ${fc}" style="width:${sw}%"></div></div>
    </div>
    ${rsiAlert}
    <div class="indicators">
      <div class="kpi"><div class="kpi-label">RSI (6)</div><div class="kpi-value" style="color:${r.rsi6<30||r.rsi6>70?'#f0b429':'#e6edf3'}">${r.rsi6}</div></div>
      <div class="kpi"><div class="kpi-label">RSI (20)</div><div class="kpi-value">${r.rsi20}</div></div>
      <div class="kpi"><div class="kpi-label">MACD hist</div><div class="kpi-value" style="color:${r.macd_hist>0?'#2ea043':'#da3633'}">${r.macd_hist}</div></div>
      <div class="kpi"><div class="kpi-label">EMA 20</div><div class="kpi-value">$${Number(r.ema20).toLocaleString()}</div></div>
    </div>
    <div class="conditions"><div class="cond-title">Condiciones</div>${condHtml}</div>
    ${levelsHtml}
  </div>`;
}

function renderGrid(results) {
  document.getElementById('grid').innerHTML = results.length
    ? results.map(renderCard).join('')
    : '<div class="loading">Sin datos</div>';
}

// ── Acertividad ──────────────────────────────────────────────────────────────

async function loadStats() {
  const el = document.getElementById('stats-grid');
  el.innerHTML = '<div class="loading">Calculando...</div>';
  try {
    const r = await fetch('/api/stats');
    const stats = await r.json();
    if (!stats.length) { el.innerHTML = '<div class="no-data">Sin señales registradas todavía.<br>Las estadísticas aparecen después de la primera señal detectada.</div>'; return; }
    el.innerHTML = stats.map(renderStatCard).join('');
  } catch(e) { el.innerHTML = '<div class="loading">Error al cargar</div>'; }
}

function wrClass(rate) { return rate >= 60 ? 'wr-good' : rate >= 45 ? 'wr-neutral' : 'wr-bad'; }

function renderStatCard(s) {
  function wrBox(label, data) {
    if (!data) return `<div class="wr-box"><div class="wr-label">${label}</div><div class="wr-value wr-neutral">—</div><div class="wr-sub">Sin datos</div></div>`;
    const cls = wrClass(data.rate);
    return `<div class="wr-box"><div class="wr-label">${label}</div><div class="wr-value ${cls}">${data.rate}%</div><div class="wr-sub">${data.wins}/${data.total} | avg ${data.avg_pct}%</div></div>`;
  }
  const recentHtml = s.recent.map(r => {
    const dir = r.signal?.includes('LONG') ? 'L' : r.signal?.includes('SHORT') ? 'S' : 'N';
    const dirColor = dir === 'L' ? '#2ea043' : dir === 'S' ? '#da3633' : '#8b949e';
    const dot = (win) => win === null || win === undefined
      ? `<div class="res-dot res-pending">?</div>`
      : win ? `<div class="res-dot res-win">W</div>` : `<div class="res-dot res-loss">L</div>`;
    const date = r.created_at ? r.created_at.substring(0,16).replace('T',' ') : '—';
    return `<div class="signal-row">
      <div><span style="color:${dirColor};font-weight:700">${dir}</span> $${Number(r.price_entry).toLocaleString()} <span class="sig-date">${date}</span></div>
      <div class="sig-result">${dot(r.win_4h)}<span style="font-size:0.65rem;color:#8b949e">4H</span>${dot(r.win_24h)}<span style="font-size:0.65rem;color:#8b949e">24H</span>${dot(r.win_72h)}<span style="font-size:0.65rem;color:#8b949e">72H</span></div>
    </div>`;
  }).join('');
  return `<div class="stat-card">
    <div class="stat-asset">${s.asset} — ${s.total_signals} señales totales</div>
    <div class="win-rates">${wrBox('4 horas', s.win_4h)}${wrBox('24 horas', s.win_24h)}${wrBox('72 horas', s.win_72h)}</div>
    <div class="recent-title">Últimas señales</div>
    ${recentHtml || '<div style="color:#8b949e;font-size:0.8rem">Sin señales aún</div>'}
  </div>`;
}

// ── Historial ────────────────────────────────────────────────────────────────

async function loadHistory() {
  const el = document.getElementById('history-table');
  el.innerHTML = '<div class="loading">Cargando...</div>';
  try {
    const r = await fetch('/api/signals');
    const signals = await r.json();
    if (!signals.length) { el.innerHTML = '<div class="no-data">Sin señales registradas todavía.</div>'; return; }
    const rows = signals.map(s => {
      const dir = s.signal?.includes('LONG') ? 'LONG' : s.signal?.includes('SHORT') ? 'SHORT' : 'NEUTRAL';
      const dirColor = dir === 'LONG' ? '#2ea043' : dir === 'SHORT' ? '#da3633' : '#8b949e';
      const dot = (win, pct) => {
        if (win === null || win === undefined) return '<span style="color:#8b949e">?</span>';
        const sign = pct > 0 ? '+' : '';
        return `<span style="color:${win?'#2ea043':'#da3633'}">${win?'W':'L'} ${sign}${pct}%</span>`;
      };
      const date = s.created_at ? s.created_at.substring(0,16).replace('T',' ') : '—';
      return `<div class="signal-row" style="gap:12px">
        <span style="color:#8b949e;width:130px;flex-shrink:0">${date}</span>
        <span style="font-weight:700;width:40px">${s.asset}</span>
        <span style="color:${dirColor};width:60px">${dir}</span>
        <span style="width:90px">$${Number(s.price_entry).toLocaleString()}</span>
        <span style="width:80px">${dot(s.win_4h, s.pct_4h)} 4H</span>
        <span style="width:80px">${dot(s.win_24h, s.pct_24h)} 24H</span>
        <span>${dot(s.win_72h, s.pct_72h)} 72H</span>
      </div>`;
    }).join('');
    el.innerHTML = `<div class="card" style="overflow-x:auto">${rows}</div>`;
  } catch(e) { el.innerHTML = '<div class="loading">Error al cargar</div>'; }
}

async function forceRefresh() {
  document.getElementById('grid').innerHTML = '<div class="loading">Actualizando...</div>';
  await fetch('/api/refresh');
  await loadData();
  if (currentTab === 'stats') loadStats();
  if (currentTab === 'history') loadHistory();
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
